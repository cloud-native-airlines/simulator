<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CNA Simulator</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #1a1d23;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
      --ok: #16a34a;
      --paused: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --panel: #181b21;
        --ink: #e8eaed;
        --muted: #9aa0aa;
        --accent: #3b82f6;
        --border: #272b33;
        --ok: #22c55e;
        --paused: #f59e0b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 20px; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
    .clock { font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 700; letter-spacing: -.01em; }
    .date { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
    .status { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 13px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .running .dot { background: var(--ok); }
    .paused .dot { background: var(--paused); }
    .running { color: var(--ok); }
    .paused { color: var(--paused); }
    .controls { display: flex; gap: 10px; margin: 24px 0 8px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
      border: 1px solid var(--border); background: var(--panel); color: var(--ink);
      padding: 10px 14px; transition: background .12s, border-color .12s;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    .primary { flex: 1; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--border); }
    .row-label { color: var(--muted); font-size: 13px; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper button { width: 34px; padding: 6px 0; text-align: center; font-size: 18px; line-height: 1; }
    .value { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 68px; text-align: right; }
    .meta { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .meta span { color: var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cloud Native Airlines · Simulator</h1>

    <div class="clock" id="sim-time">--:--:--</div>
    <div class="date" id="sim-date">—</div>
    <div class="status running" id="status"><span class="dot"></span><span id="status-text">—</span></div>

    <div class="controls">
      <button class="primary" id="play-pause">Play</button>
      <button id="reset">Reset</button>
    </div>

    <div class="row">
      <span class="row-label">Clock speed (sim&nbsp;s / real&nbsp;s)</span>
      <div class="stepper">
        <button data-step="speed-down">−</button>
        <span class="value" id="speed">—</span>
        <button data-step="speed-up">+</button>
      </div>
    </div>

    <div class="row">
      <span class="row-label">Tick interval (real s)</span>
      <div class="stepper">
        <button data-step="interval-down">−</button>
        <span class="value" id="interval">—</span>
        <button data-step="interval-up">+</button>
      </div>
    </div>

    <div class="meta">
      run <span id="run-id">—</span> · tick <span id="tick-id">—</span>
    </div>
  </div>

  <script>
    const SPEED_LADDER = [1, 2, 5, 10, 30, 60, 120, 300, 600];
    const INTERVAL_LADDER = [0.1, 0.25, 0.5, 1, 2, 5, 10, 30];

    let state = null;

    function stepLadder(ladder, current, dir) {
      // Find the nearest ladder value, then move one notch in `dir` (+1 / -1).
      let idx = 0, best = Infinity;
      ladder.forEach((v, i) => { const d = Math.abs(v - current); if (d < best) { best = d; idx = i; } });
      idx = Math.min(ladder.length - 1, Math.max(0, idx + dir));
      return ladder[idx];
    }

    async function api(method, path, body) {
      const opts = { method };
      if (body) { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error(path + " -> " + res.status);
      return res.json();
    }

    function render(s) {
      state = s;
      const t = new Date(s.simulated_at);
      document.getElementById("sim-time").textContent = t.toISOString().slice(11, 19) + " UTC";
      document.getElementById("sim-date").textContent = t.toISOString().slice(0, 10);
      document.getElementById("speed").textContent = s.speed + "×";
      document.getElementById("interval").textContent = s.tick_interval + "s";
      document.getElementById("run-id").textContent = s.run_id;
      document.getElementById("tick-id").textContent = s.tick_id;

      const statusEl = document.getElementById("status");
      statusEl.className = "status " + (s.paused ? "paused" : "running");
      document.getElementById("status-text").textContent = s.paused ? "Paused" : "Running";
      document.getElementById("play-pause").textContent = s.paused ? "Play" : "Pause";
    }

    async function poll() {
      try { render(await api("GET", "/clock")); } catch (e) { /* transient */ }
    }

    document.getElementById("play-pause").addEventListener("click", async () => {
      if (!state) return;
      render(await api("POST", state.paused ? "/control/resume" : "/control/pause"));
    });
    document.getElementById("reset").addEventListener("click", async () => {
      render(await api("POST", "/control/reset"));
    });

    document.querySelectorAll("[data-step]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!state) return;
        const kind = btn.dataset.step;
        if (kind.startsWith("speed")) {
          const next = stepLadder(SPEED_LADDER, state.speed, kind.endsWith("up") ? 1 : -1);
          render(await api("PATCH", "/clock", { speed: next }));
        } else {
          const next = stepLadder(INTERVAL_LADDER, state.tick_interval, kind.endsWith("up") ? 1 : -1);
          render(await api("PATCH", "/clock", { tick_interval: next }));
        }
      });
    });

    poll();
    setInterval(poll, 500);
  </script>
</body>
</html>
